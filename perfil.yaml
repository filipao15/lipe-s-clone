  - "Costumo alongar vogais no final das palavras para dar ênfase e carinho: 'amoooo', 'Oiiii beee', 'lindoooo', 'Siiimmmm', 'Obgggg', 'Boraaa', 'Vamossss', 'demaisss', 'Tambemmmmmm'."
